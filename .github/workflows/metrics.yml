name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # updates daily
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

          # USER
          user: Kushanware
          template: classic
          base: header, activity, community
          config_timezone: Asia/Kolkata
          config_animations: yes
          config_display: large
          config_twemoji: yes
          config_margin: 8
          config_padding: 12

          # LANGUAGES
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 10

          # HABITS
          plugin_habits: yes
          plugin_habits_days: 14
          plugin_habits_charts: yes
          plugin_habits_facts: yes

          # ACHIEVEMENTS
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C

          # LEETCODE
          plugin_leetcode: yes
          plugin_leetcode_user: Kushanware   # change if LC username differs
          plugin_leetcode_sections: solved, skills, recent
          plugin_leetcode_limit_recent: 5

          # CODEFORCES
          plugin_codeforces: yes
          plugin_codeforces_user: Kushanware # change if username differs
          plugin_codeforces_sections: rating, contests, problems
